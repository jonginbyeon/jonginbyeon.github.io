<!doctype html>
<html lang="ko">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Press — Jongin Byeon</title>
    <meta name="theme-color" content="#e9e7e2" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Press — Jongin Byeon" />
    <meta property="og:description" content="Press — Jongin Byeon." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Press — Jongin Byeon" />
    <meta name="twitter:description" content="Press — Jongin Byeon." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23e9e7e2'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='46' text-anchor='middle' fill='%23181817'%3EJB%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,400;0,500;1,400;1,500&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root { --ink:#181817; --paper:#e9e7e2; --line:rgba(24,24,23,.28); }
      * { box-sizing:border-box; }
      body { min-height:100svh; margin:0; color:var(--ink); background:var(--paper); font-family:"Space Grotesk",sans-serif; }
      a { color:inherit; }
      a:focus-visible { outline:1px solid var(--ink); outline-offset:4px; }
      header { display:flex; justify-content:space-between; align-items:center; padding:24px 28px; font:500 10px "DM Mono",monospace; letter-spacing:.1em; text-transform:uppercase; }
      header a { text-decoration:none; }
      main { min-height:calc(100svh - 160px); padding:90px 28px 28px; }
      .eyebrow { margin:0 0 24px; font:500 10px "DM Mono",monospace; letter-spacing:.12em; text-transform:uppercase; }
      h1 { max-width:900px; margin:0 0 110px; font:400 clamp(4rem,10vw,9.5rem)/.84 "Fraunces",serif; letter-spacing:-.035em; }
      h1 em { color:#65635e; font-weight:400; font-style:italic; }
      .list { border-top:1px solid var(--line); }
      article { display:grid; grid-template-columns:75px minmax(0,1.4fr) minmax(190px,.7fr); gap:24px; padding:25px 0; border-bottom:1px solid var(--line); align-items:baseline; }
      article span { font:400 10px "DM Mono",monospace; letter-spacing:.08em; }
      h2 { margin:0; font:400 clamp(1.6rem,3.6vw,3rem)/1.05 "Fraunces",serif; letter-spacing:-.02em; }
      .title-row { display:flex; flex-direction:column; align-items:flex-start; gap:8px; }
      .press-link { font:500 10px "DM Mono",monospace; letter-spacing:.08em; text-transform:uppercase; text-decoration:underline; text-underline-offset:4px; color:#5e5c56; }
      article p { margin:0; font-size:13px; line-height:1.45; }
      article p a { text-decoration:underline; text-underline-offset:3px; }
      .empty-state { padding:46px 0; color:#5e5c56; font-size:14px; line-height:1.6; max-width:460px; }
      footer { display:flex; justify-content:space-between; padding:24px 28px; font:500 10px "DM Mono",monospace; letter-spacing:.1em; text-transform:uppercase; }
      @media (max-width:620px) { header,main,footer { padding-left:16px; padding-right:16px; } main { padding-top:55px; } h1 { margin-bottom:65px; } article { grid-template-columns:38px 1fr; gap:10px; } article p { grid-column:2; margin-top:4px; } }
    </style>
  </head>
  <body>
    <header><a href="index.html">Jongin Byeon</a><a href="index.html" aria-label="Back to newsletter">← Newsletter</a></header>
    <main>
      <p class="eyebrow">In the media</p>
      <h1><em>Press.</em></h1>
      <section class="list">
        <!--
          Add entries here as they come in, matching this shape:
          <article>
            <span>01</span>
            <div class="title-row">
              <h2>Article headline</h2>
              <a class="press-link" href="https://example.com/article" target="_blank" rel="noopener">Publication Name</a>
            </div>
            <p>Month 2026<br /><a href="https://example.com/article" target="_blank" rel="noopener">Read ↗</a></p>
          </article>
        -->
      </section>
      <p class="empty-state">새로운 프레스 소식이 준비되는 대로 이곳에 업데이트됩니다.</p>
    </main>
    <footer><span>© 2026 Jongin Byeon</span><a href="mailto:jb@byeonjongin.com">jb@byeonjongin.com</a></footer>
  </body>
</html>
